name: Build desktop apps

# Builds the double-click app for Windows AND macOS in the cloud.
#  • Click "Run workflow" on the Actions tab to build anytime (downloads under
#    the run's "Artifacts").
#  • Push a version tag like v1.0.0 to also publish a GitHub Release with both
#    ready-to-run zips attached.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            binary: RC Sound Configurator.exe
            bundle: RC-Sound-Configurator-Windows
            # --noconsole: no black terminal window; the app runs in the background
            # and the browser tab is the UI (Quit button stops it).
            # --icon: use the TheDIYGuy999 logo as the .exe icon.
            pyi_args: "--noconsole --icon web/icon.ico"
          - os: macos-latest        # Apple Silicon runner; universal2 build runs on Intel too
            label: macOS
            binary: RC Sound Configurator
            bundle: RC-Sound-Configurator-macOS
            pyi_args: "--target-arch universal2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller certifi

      - name: Build one-file app
        run: pyinstaller --onefile ${{ matrix.pyi_args }} --collect-data certifi --name "RC Sound Configurator" configure.py

      - name: Assemble ready-to-run bundle
        shell: bash
        run: |
          set -e
          mkdir staging
          # Everything the app needs at runtime, plus a Python fallback launcher.
          cp -r src web tools data libraries README.md configure.py start_webui.bat start_webui.command staging/ 2>/dev/null || true
          cp "dist/${{ matrix.binary }}" staging/
          if [ "${{ runner.os }}" = "macOS" ]; then
            chmod +x "staging/${{ matrix.binary }}"
            L="staging/Start RC Sound Configurator.command"
            printf '%s\n' \
              '#!/bin/bash' \
              'cd "$(dirname "$0")"' \
              '# Clear the "downloaded from internet" quarantine so the unsigned app can run.' \
              'xattr -dr com.apple.quarantine "./RC Sound Configurator" 2>/dev/null || true' \
              'exec "./RC Sound Configurator"' > "$L"
            chmod +x "$L"
          fi

      - name: Zip bundle
        shell: bash
        run: |
          cd staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../${{ matrix.bundle }}.zip" . >/dev/null
          else
            zip -r -y "../${{ matrix.bundle }}.zip" . >/dev/null
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.bundle }}.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Attach zips to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dl/**/*.zip
          generate_release_notes: true
