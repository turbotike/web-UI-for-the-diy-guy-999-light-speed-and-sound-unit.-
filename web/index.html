<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The DIYGuy999 · Light · Sound · Speed Controller</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/styles.css">
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 436 70" role="img" aria-label="The DIYGuy999 Light Sound and Speed Controller">
      <defs>
        <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#fff24d"/>
          <stop offset=".38" stop-color="#ff9d00"/>
          <stop offset=".72" stop-color="#ff2e00"/>
          <stop offset="1" stop-color="#a80000"/>
        </linearGradient>
        <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".47" stop-color="#eef8ff"/>
          <stop offset=".53" stop-color="#a6d1ff"/>
          <stop offset="1" stop-color="#ffffff"/>
        </linearGradient>
        <filter id="fglow" x="-15%" y="-40%" width="130%" height="200%">
          <feGaussianBlur stdDeviation="1.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- tall licking tongues behind the text -->
      <path fill="url(#flame)" opacity=".92" d="M96 40 C86 18 104 20 100 2 C112 16 108 30 116 34 Z M232 40 C222 16 240 18 236 0 C248 14 244 30 252 34 Z M356 42 C346 20 364 22 360 4 C372 18 368 32 376 36 Z"/>
      <!-- main flame band -->
      <path filter="url(#fglow)" fill="url(#flame)" d="M34 60 C48 30 56 48 68 16 C82 44 92 30 104 10 C120 42 130 28 144 18 C160 44 170 22 186 8 C204 44 216 30 230 16 C248 44 260 26 274 12 C292 44 304 38 318 20 C336 44 348 22 362 10 C380 42 392 40 414 60 Z"/>
      <!-- wordmark: chrome with dark outline, sitting over the flames -->
      <text x="46" y="46" font-family="'Arial Black',Impact,'Trebuchet MS',sans-serif" font-size="35" font-weight="900" font-style="italic" letter-spacing="-1"
            fill="url(#chrome)" stroke="#5a0000" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">DIYGuy999</text>
      <!-- tagline -->
      <text x="49" y="66" font-family="'Arial Narrow','Trebuchet MS',system-ui,sans-serif" font-size="9.6" letter-spacing="2" font-weight="700" fill="#ffcf00">LIGHT &#183; SOUND &#183; SPEED CONTROLLER</text>
    </svg>
  </div>
  <div class="veh">
    <label for="vehicleSel">Vehicle</label>
    <select id="vehicleSel"><option>Loading…</option></select>
  </div>
  <div class="spacer"></div>
  <span id="dirty" class="dirty"></span>
  <button id="saveBtn">Save</button>
  <button id="flashBtnTop" class="primary">⚡ Flash</button>
</header>

<nav id="tabs"></nav>
<main id="content">
  <div class="empty">Loading configuration…</div>
</main>

<input type="file" id="importFile" accept=".h" style="display:none">
<input type="file" id="wavFile" accept=".wav,audio/*" style="display:none">
<div id="modal"></div>
<div id="toast"></div>

<script type="module" src="/web/app.js"></script>
</body>
</html>
